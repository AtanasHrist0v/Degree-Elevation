<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degree elevation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="init()">
    <h1>Degree elevation</h1>
    <h2>Click +: Increase degree | Click Clear: Clear canvas | Drag: Move</h2>
    <canvas id="curve">
    </canvas>
    <div>
        <button onclick="reset()" id="clear">Clear</button>
        <button onclick="increaseDegree()" id="increaseDegree">+</button>
    </div>
    <script src="script.js"></script>
</body>
</body>

</html>
